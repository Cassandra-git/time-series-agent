name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
      - name: Install Python and dependencies
        run: uv sync --locked
      - name: Run tests (no Ollama needed)
        run: uv run pytest -q
